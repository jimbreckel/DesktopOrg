name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Single-File Executable
        run: |
          dotnet publish DesktopOrg.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./dist
          Copy-Item ./dist/DesktopOrg.exe ./dist/DesktopOrg-Setup.exe -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DesktopOrg-win-x64
          path: |
            dist/DesktopOrg-Setup.exe
            dist/DesktopOrg.exe
            Install-DesktopOrg.ps1
            Uninstall-DesktopOrg.ps1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DesktopOrg-Setup.exe
            dist/DesktopOrg.exe
            Install-DesktopOrg.ps1
            Uninstall-DesktopOrg.ps1

